
services:
  php:
    image: jayakrishnanjk/my-first-project:latest
    container_name: php-app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
